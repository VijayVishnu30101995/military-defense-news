services:
  - type: web
    name: military-defense-news-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ENV
        value: production
      - key: NEWS_TIMEZONE
        value: Asia/Kolkata
      - key: PYTHON_VERSION
        value: 3.13.0
