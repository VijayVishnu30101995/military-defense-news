services:
  postgres:
    image: postgres:16
    container_name: defense-news-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: defense_news
      POSTGRES_USER: defense_news
      POSTGRES_PASSWORD: defense_news

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defense_news -d defense_news"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: